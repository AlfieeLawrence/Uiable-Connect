<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Uiable Connect</title>
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="xterm.css"><link rel="stylesheet" href="app.css">
</head><body>
<div id="wallpaper"></div>
<div id="boot"><div class="boot-logo">Uiable <span>Connect</span></div><div class="boot-sub">Launching…</div></div>
<div id="layout">
  <aside id="side">
    <div class="brand row"><img src="favicon.svg" alt=""><div><b>Uiable</b> <span class="muted">Connect</span></div></div>
    <div id="srvlist"></div>
    <div class="side-foot">
      <button class="primary" id="addSrv">+ Add connection</button>
      <button id="quickB" title="Quick connect — one-off, not saved" aria-label="Quick connect">⚡</button>
      <button id="bakB" title="Encrypted backup and restore" aria-label="Backup">⇪</button>
      <button id="setB" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </aside>
  <main id="main"><div id="panes"></div></main>
</div>
<div id="scrim"></div>
<div id="toasts"></div>
<script src="xterm.js"></script><script src="addon-fit.js"></script><script src="addon-search.js"></script><script src="health.js"></script><script src="alerts.js"></script><script src="editor.js"></script><script src="uiable-install.js"></script><script src="snippets.js"></script><script src="backup.js"></script><script src="app.js"></script>
</body></html>
