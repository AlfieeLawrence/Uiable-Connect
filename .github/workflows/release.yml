name: Release

# Builds every platform and attaches the files to the GitHub release for the tag.
# Cut a release with:  git tag v1.1.1 && git push --tags
# "Run workflow" (workflow_dispatch) builds everything and keeps the files as workflow artifacts;
# it only publishes a release if you give it a tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing or new tag to publish to (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      # Install without lifecycle scripts (npm allowScripts / untrusted postinstall), then run only Electron's
      # own installer so the Electron binary electron-builder needs is downloaded.
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npx electron-builder --win portable zip --x64 --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run dist:mac -- --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }   # unsigned build (identity: null in package.json)
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - run: npm ci --ignore-scripts
      - run: npm run web
      - run: npx cap sync android
      - name: Build debug + unsigned release APKs
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease
          ver="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF_TYPE" == tag ]] || ver=dev
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk "../out/Uiable-Connect-${ver}-android-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "../out/Uiable-Connect-${ver}-android-release-unsigned.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: mobile/out/*.apk, if-no-files-found: error }

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: npm ci --ignore-scripts
      - run: npm run web
      - run: npx cap sync ios   # runs scripts/ios-fix.js via the capacitor:sync:after hook
      - name: Archive (unsigned, iPhone + iPad)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            TARGETED_DEVICE_FAMILY="1,2" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive
      - name: Package unsigned .ipa (sideload with Sideloadly / AltStore)
        run: |
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          mkdir -p out && (cd build && zip -qry ../out/Uiable-Connect.ipa Payload)
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: mobile/out/Uiable-Connect.ipa, if-no-files-found: error }

  release:
    needs: [windows, mac, android, ios]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Uiable Connect ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
          body: |
            **Windows:** `Uiable Connect x.y.z.exe` (portable) or the `-win.zip`. Unsigned: SmartScreen > More info > Run anyway.
            **macOS:** `.dmg` / `.zip` for Intel (x64) and Apple Silicon (arm64). Unsigned: right-click the app > Open the first time.
            **Android:** install the `android-debug.apk` (allow installs from unknown sources). The `release-unsigned` APK must be signed before use.
            **iPhone / iPad:** `Uiable-Connect.ipa` is unsigned. Sideload it with Sideloadly or AltStore (iOS 17+).
