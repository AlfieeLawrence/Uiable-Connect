name: Release

# Builds every platform and attaches the files to the GitHub release for the tag.
# Cut a release with:  git tag v1.1.1 && git push --tags
# "Run workflow" (workflow_dispatch) builds everything and keeps the files as workflow artifacts;
# it only publishes a release if you give it a tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing or new tag to publish to (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: read

env:
  NODE_VERSION: '26'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      # Install without lifecycle scripts (npm allowScripts / untrusted postinstall), then run only Electron's
      # own installer so the Electron binary electron-builder needs is downloaded.
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npx electron-builder --win nsis portable zip --x64 --publish never
        # signs when the CSC_* secrets are set (base64 .pfx + password); builds unsigned otherwise
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run dist:mac -- --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }   # ad-hoc signed (identity "-" in package.json), no notarization
      - name: Verify ad-hoc signature (app inside every .dmg and -mac.zip, x64 + arm64)
        run: |
          set -e; chk() { echo "== $1"; codesign -dv "$1" 2>&1 | grep -E "Signature|Identifier|flags"; codesign --verify --deep --strict "$1"; spctl -a -vvv -t exec "$1" 2>&1 || true; }
          for z in dist/*-mac.zip; do d=$(mktemp -d); ditto -x -k "$z" "$d"; chk "$d/Uiable Connect.app"; done
          for g in dist/*.dmg; do m=$(mktemp -d); hdiutil attach -nobrowse -readonly -mountpoint "$m" "$g" >/dev/null; chk "$m/Uiable Connect.app"; hdiutil detach "$m" >/dev/null; done
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - run: npm ci --ignore-scripts
      - run: npm run web
      - run: npx cap sync android
      - name: Build debug + unsigned release APKs
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease
          ver="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF_TYPE" == tag ]] || ver=dev
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk "../out/Uiable-Connect-${ver}-android-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "../out/Uiable-Connect-${ver}-android-release-unsigned.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: mobile/out/*.apk, if-no-files-found: error }

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: npm ci --ignore-scripts
      - run: npm run web
      - run: npx cap sync ios   # runs scripts/ios-fix.js via the capacitor:sync:after hook
      - name: Archive (unsigned, iPhone + iPad)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            TARGETED_DEVICE_FAMILY="1,2" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive
      - name: Package unsigned .ipa (sideload with Sideloadly / AltStore)
        run: |
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          # Ad-hoc sign every framework and the app so the .ipa has a valid signature for re-signers / LiveContainer
          find build/Payload/App.app -name '*.framework' -o -name '*.dylib' | while read f; do codesign --force --sign - "$f"; done
          codesign --force --sign - --timestamp=none build/Payload/App.app
          codesign -dv build/Payload/App.app
          mkdir -p out && (cd build && zip -qry ../out/Uiable-Connect.ipa Payload)
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: mobile/out/Uiable-Connect.ipa, if-no-files-found: error }

  docker:
    # Multi-arch web version -> ghcr.io/alfieelawrence/uiable-connect:<version> and :latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          T="${{ inputs.tag || github.ref_name }}"
          echo "version=${T#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        env: { DOCKER_BUILD_RECORD_UPLOAD: 'false', DOCKER_BUILD_SUMMARY: 'false' }
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.description=Uiable Connect web version (SSH, SFTP, stats, forwards) in a browser
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [windows, mac, android, ios]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        # Only the app builds (the docker job's build-record artifact must not be merged in)
        with: { path: artifacts, merge-multiple: true, pattern: '{windows,mac,android,ios}' }
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Uiable Connect ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
          body: |
            **Windows:** `Uiable Connect x.y.z.exe` (portable) or the `-win.zip`. Unsigned: SmartScreen > More info > Run anyway.
            **macOS:** `.dmg` / `.zip` for Intel (x64) and Apple Silicon (arm64). Ad-hoc signed (not notarized): right-click the app > Open the first time. If macOS still says it's damaged, run `xattr -cr "/Applications/Uiable Connect.app"`.
            **Android:** install the `android-debug.apk` (allow installs from unknown sources). The `release-unsigned` APK must be signed before use.
            **Docker (web version):** `docker pull ghcr.io/alfieelawrence/uiable-connect:latest`. See the README's Docker section.
            **iPhone / iPad:** `Uiable-Connect.ipa` is unsigned. Sideload it with Sideloadly or AltStore (iOS 17+).
