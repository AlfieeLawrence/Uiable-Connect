# Uiable Connect in Docker:  docker compose up -d   then open http://localhost:8484
services:
  uiable-connect:
    image: ghcr.io/alfieelawrence/uiable-connect:latest
    # build: .            # or build it from this folder
    container_name: uiable-connect
    restart: unless-stopped
    ports:
      - "127.0.0.1:8484:8484"        # the web UI, only on this computer
      # Port forwards (tunnels) listen inside the container. Docker can't open new PC ports at
      # runtime — each forward's PC port must be published here, e.g. a range like below.
      # Tell the app which ports you published via UC_FWD_PORTS so the UI can check them.
      - "127.0.0.1:8080-8090:8080-8090"
      # - "127.0.0.1:9000-9010:9000-9010"   # example: more ports for your own forwards
    environment:
      # UC_PASSWORD: "change-me"     # optional login; REQUIRED if you publish on anything but 127.0.0.1
      # UC_SECRET: "long random string"  # optional: key for saved passwords (default: random key in the volume)
      # UC_ALLOWED_HOSTS: "myhost.lan"   # extra host names allowed without UC_PASSWORD
      # UC_FWD_PORTS: "8080-8090,9000-9010"  # must match the ports: published above (default 8080-8090)
      TZ: Europe/London
    volumes:
      - uiable-connect-data:/data
    mem_limit: 192m
volumes:
  uiable-connect-data:
